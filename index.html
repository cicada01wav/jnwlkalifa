<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>JNWLKALIFA</title>

    <style>

        /* =====================================================
           BASE
        ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: #000;
            color: #fff;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            min-height: 100vh;

            overflow-x: hidden;

            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }


        /* =====================================================
           CURSEUR / HALO
        ===================================================== */

        .cursor-glow {

            position: fixed;

            width: 380px;
            height: 380px;

            border-radius: 50%;

            pointer-events: none;

            z-index: 0;

            background:
                radial-gradient(
                    circle,
                    rgba(255,255,255,0.035) 0%,
                    rgba(255,255,255,0.012) 28%,
                    rgba(255,255,255,0) 70%
                );

            transform:
                translate(-50%, -50%);

            transition:
                left 0.12s ease-out,
                top 0.12s ease-out;

            opacity: 0.7;
        }


        /* =====================================================
           GRAIN TRÈS LÉGER
        ===================================================== */

        body::before {

            content: "";

            position: fixed;

            inset: 0;

            pointer-events: none;

            z-index: 50;

            opacity: 0.025;

            background-image:
                url("https://www.transparenttextures.com/patterns/asfalt-light.png");

            animation:
                grainMove 0.25s infinite;
        }

        @keyframes grainMove {

            0% {
                transform: translate(0,0);
            }

            25% {
                transform: translate(-1%,1%);
            }

            50% {
                transform: translate(1%,-1%);
            }

            75% {
                transform: translate(-1%,-1%);
            }

            100% {
                transform: translate(0,0);
            }

        }


        /* =====================================================
           INTRO
        ===================================================== */

        .intro {

            position: fixed;

            inset: 0;

            width: 100%;
            height: 100vh;

            background: #000;

            display: flex;

            align-items: center;
            justify-content: center;

            z-index: 1000;

            animation:
                introDisappear
                1.5s
                cubic-bezier(0.77,0,0.175,1)
                forwards;

            animation-delay: 1.35s;
        }

        .intro-logo {

            width: 520px;

            max-width: 78vw;

            opacity: 0;

            transform:
                scale(0.88);

            animation:
                introLogo
                1.1s
                cubic-bezier(0.22,1,0.36,1)
                forwards;
        }

        @keyframes introLogo {

            0% {
                opacity: 0;
                transform: scale(0.88);
                filter: blur(8px);
            }

            100% {
                opacity: 1;
                transform: scale(1);
                filter: blur(0);
            }

        }

        @keyframes introDisappear {

            0% {
                opacity: 1;
                visibility: visible;
            }

            70% {
                opacity: 1;
            }

            100% {
                opacity: 0;
                visibility: hidden;
                pointer-events: none;
            }

        }


        /* =====================================================
           HEADER
        ===================================================== */

        .top-header {

            position: fixed;

            top: 0;
            left: 0;

            width: 100%;

            padding:
                18px
                20px;

            display: flex;

            justify-content:
                space-between;

            align-items: flex-start;

            z-index: 100;

            pointer-events: none;

            mix-blend-mode: difference;
        }

        .brand {

            font-size: 11px;

            letter-spacing:
                0.14em;

            font-weight: 400;

            text-transform: uppercase;
        }

        .counter {

            font-size: 10px;

            letter-spacing:
                0.12em;

            opacity: 0.55;
        }


        /* =====================================================
           CONTENU PRINCIPAL
        ===================================================== */

        main {

            position: relative;

            z-index: 2;
        }


        /* =====================================================
           HERO
        ===================================================== */

        .hero {

            min-height: 100vh;

            width: 100%;

            display: flex;

            flex-direction: column;

            justify-content: center;
            align-items: center;

            padding:
                60px
                20px
                100px;

            position: relative;
        }

        .hero-inner {

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            opacity: 0;

            transform:
                translateY(20px);

            animation:
                heroAppear
                1.8s
                cubic-bezier(0.22,1,0.36,1)
                forwards;

            animation-delay: 1.55s;
        }

        @keyframes heroAppear {

            0% {
                opacity: 0;
                transform: translateY(20px);
            }

            100% {
                opacity: 1;
                transform: translateY(0);
            }

        }

        .main-logo {

            width: 430px;

            max-width: 78vw;

            height: auto;

            cursor: pointer;

            display: block;

            transition:
                transform 0.8s
                cubic-bezier(0.22,1,0.36,1),

                opacity 0.5s ease,

                filter 0.8s ease;
        }

        .main-logo:hover {

            transform:
                scale(1.025);

            filter:
                brightness(1.08);
        }


        /* =====================================================
           EMAIL
        ===================================================== */

        .email {

            margin-top: 30px;

            color: #fff;

            text-decoration: none;

            font-size: 18px;

            letter-spacing:
                0.02em;

            font-weight: 300;

            position: relative;

            opacity: 0.78;

            transition:
                opacity 0.4s ease;
        }

        .email::after {

            content: "";

            position: absolute;

            left: 0;
            bottom: -5px;

            width: 100%;
            height: 1px;

            background: #fff;

            transform:
                scaleX(0);

            transform-origin:
                right;

            transition:
                transform 0.5s
                cubic-bezier(0.22,1,0.36,1);
        }

        .email:hover {

            opacity: 1;
        }

        .email:hover::after {

            transform:
                scaleX(1);

            transform-origin:
                left;
        }


        /* =====================================================
           SECTIONS
        ===================================================== */

        .section {

            width: 100%;

            padding:
                120px
                20px;

            opacity: 0;

            transform:
                translateY(45px);

            filter:
                blur(7px);

            transition:
                opacity 1.2s
                cubic-bezier(0.22,1,0.36,1),

                transform 1.2s
                cubic-bezier(0.22,1,0.36,1),

                filter 1.2s
                cubic-bezier(0.22,1,0.36,1);
        }

        .section.visible {

            opacity: 1;

            transform:
                translateY(0);

            filter:
                blur(0);
        }


        /* =====================================================
           SECTION HEADER
        ===================================================== */

        .section-header {

            width: 100%;

            max-width: 1500px;

            margin:
                0 auto 28px;

            display: flex;

            align-items: baseline;

            justify-content: space-between;

            border-bottom:
                1px solid
                rgba(255,255,255,0.14);

            padding-bottom: 11px;
        }

        .section-title {

            font-size: 10px;

            letter-spacing:
                0.18em;

            text-transform:
                uppercase;

            font-weight: 400;
        }

        .section-number {

            font-size: 9px;

            letter-spacing:
                0.12em;

            opacity: 0.35;
        }


        /* =====================================================
           SCROLL WRAPPER
        ===================================================== */

        .scroll-wrapper {

            width: 100%;

            max-width: 1500px;

            margin: 0 auto;

            position: relative;
        }

        .horizontal-scroll {

            width: 100%;

            display: flex;

            gap: 18px;

            overflow-x: auto;

            overflow-y: hidden;

            scroll-behavior: smooth;

            scrollbar-width: none;

            padding:
                4px 0
                16px;
        }

        .horizontal-scroll::-webkit-scrollbar {
            display: none;
        }


        /* =====================================================
           FLÈCHES
        ===================================================== */

        .arrow {

            position: absolute;

            top: 50%;

            transform:
                translateY(-50%);

            z-index: 10;

            width: 42px;
            height: 42px;

            border: 1px solid
                rgba(255,255,255,0.25);

            border-radius: 50%;

            background:
                rgba(0,0,0,0.55);

            color: #fff;

            font-size: 20px;

            font-weight: 200;

            cursor: pointer;

            display: flex;

            justify-content: center;
            align-items: center;

            opacity: 0;

            transition:
                opacity 0.35s ease,

                background 0.35s ease,

                transform 0.35s ease;
        }

        .scroll-wrapper:hover .arrow {

            opacity: 1;
        }

        .arrow:hover {

            background:
                rgba(255,255,255,0.1);

            transform:
                translateY(-50%)
                scale(1.08);
        }

        .arrow.left {
            left: 14px;
        }

        .arrow.right {
            right: 14px;
        }


        /* =====================================================
           CLIPS YOUTUBE
        ===================================================== */

        .clip-card {

            flex:
                0 0 min(68vw, 900px);

            aspect-ratio:
                16 / 9;

            background:
                #080808;

            overflow: hidden;

            position: relative;

            border:
                1px solid
                rgba(255,255,255,0.08);

            transition:
                transform 0.7s
                cubic-bezier(0.22,1,0.36,1),

                border-color 0.4s ease;
        }

        .clip-card:hover {

            transform:
                translateY(-4px);

            border-color:
                rgba(255,255,255,0.22);
        }

        .clip-card iframe {

            width: 100%;
            height: 100%;

            display: block;

            border: none;
        }


        /* =====================================================
           CRÉDITS
        ===================================================== */

        .credit-card {

            flex:
                0 0 430px;

            height: 300px;

            background:
                #080808;

            border:
                1px solid
                rgba(255,255,255,0.09);

            display: flex;

            flex-direction: column;

            justify-content: center;
            align-items: center;

            position: relative;

            text-decoration: none;

            color: #fff;

            overflow: hidden;

            transition:
                transform 0.7s
                cubic-bezier(0.22,1,0.36,1),

                background 0.5s ease,

                border-color 0.5s ease;
        }

        .credit-card:hover {

            transform:
                translateY(-5px);

            background:
                #0d0d0d;

            border-color:
                rgba(255,255,255,0.2);
        }

        .credit-main {

            font-size: 24px;

            letter-spacing:
                0.03em;

            font-weight: 300;
        }

        .credit-sub {

            margin-top: 14px;

            font-size: 10px;

            letter-spacing:
                0.13em;

            text-transform:
                uppercase;

            opacity: 0.4;
        }

        .credit-arrow {

            position: absolute;

            right: 18px;
            bottom: 17px;

            font-size: 15px;

            opacity: 0.35;

            transition:
                opacity 0.4s ease,

                transform 0.4s ease;
        }

        .credit-card:hover .credit-arrow {

            opacity: 1;

            transform:
                translate(3px,-3px);
        }


        /* =====================================================
           SPOTIFY
        ===================================================== */

        .spotify-card {

            flex:
                0 0 430px;

            height: 300px;

            overflow: hidden;

            background:
                #000;

            border:
                1px solid
                rgba(255,255,255,0.09);
        }

        .spotify-card iframe {

            width: 100%;
            height: 100%;

            border: none;
        }


        /* =====================================================
           SOUNDCLOUD
        ===================================================== */

        .soundcloud-card {

            flex:
                0 0 430px;

            height: 300px;

            overflow: hidden;

            background:
                #000;

            border:
                1px solid
                rgba(255,255,255,0.09);
        }

        .soundcloud-card iframe {

            width: 100%;
            height: 100%;

            border: none;
        }


        /* =====================================================
           INSTAGRAM MAPLUSTP
        ===================================================== */

        .social-section {

            width: 100%;

            padding:
                80px
                20px
                50px;

            display: flex;

            justify-content: center;
        }

        .social-link {

            color: #fff;

            text-decoration: none;

            font-size:
                clamp(30px, 5vw, 58px);

            letter-spacing:
                -0.035em;

            font-weight: 300;

            position: relative;

            transition:
                opacity 0.4s ease,

                transform 0.5s
                cubic-bezier(0.22,1,0.36,1);
        }

        .social-link::after {

            content: "";

            position: absolute;

            left: 0;
            right: 0;

            bottom: -9px;

            height: 1px;

            background:
                rgba(255,255,255,0.7);

            transform:
                scaleX(0);

            transform-origin:
                right;

            transition:
                transform 0.6s
                cubic-bezier(0.22,1,0.36,1);
        }

        .social-link:hover {

            opacity: 0.65;

            transform:
                translateY(-3px);
        }

        .social-link:hover::after {

            transform:
                scaleX(1);

            transform-origin:
                left;
        }


        /* =====================================================
           UNTITLED
        ===================================================== */

        .untitled-section {

            width: 100%;

            padding:
                20px
                20px
                55px;

            display: flex;

            justify-content: center;

            align-items: center;

            gap: 80px;
        }

        .untitled-link {

            color: #fff;

            text-decoration: none;

            font-size: 14px;

            letter-spacing:
                0.12em;

            text-transform:
                uppercase;

            opacity: 0.75;

            position: relative;

            transition:
                opacity 0.4s ease;
        }

        .untitled-link::after {

            content: "";

            position: absolute;

            left: 0;
            bottom: -5px;

            width: 100%;
            height: 1px;

            background: #fff;

            transform:
                scaleX(0);

            transform-origin:
                right;

            transition:
                transform 0.45s
                cubic-bezier(0.22,1,0.36,1);
        }

        .untitled-link:hover {

            opacity: 1;
        }

        .untitled-link:hover::after {

            transform:
                scaleX(1);

            transform-origin:
                left;
        }


        /* =====================================================
           COURT METRAGES
        ===================================================== */

        .short-film-section {

            width: 100%;

            padding:
                25px
                20px
                100px;

            display: flex;

            justify-content: center;
        }

        .short-film-link {

            color: #fff;

            text-decoration: none;

            font-size: 14px;

            letter-spacing:
                0.13em;

            text-transform:
                uppercase;

            opacity: 0.7;

            transition:
                opacity 0.4s ease,

                transform 0.4s ease;
        }

        .short-film-link:hover {

            opacity: 1;

            transform:
                translateY(-2px);
        }


        /* =====================================================
           QUALIA
        ===================================================== */

        .qualia-section {

            width: 100%;

            padding:
                90px
                20px
                180px;
        }

        .qualia-grid {

            max-width: 1500px;

            margin: 0 auto;

            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 18px;
        }

        .qualia-box {

            min-height: 430px;

            background:
                #080808;

            border:
                1px solid
                rgba(255,255,255,0.09);

            display: flex;

            flex-direction: column;

            justify-content: center;
            align-items: center;

            text-decoration: none;

            color: #fff;

            position: relative;

            transition:
                transform 0.7s
                cubic-bezier(0.22,1,0.36,1),

                background 0.5s ease,

                border-color 0.5s ease;
        }

        .qualia-box:hover {

            transform:
                translateY(-5px);

            background:
                #0d0d0d;

            border-color:
                rgba(255,255,255,0.2);
        }

        .qualia-type {

            font-size: 9px;

            letter-spacing:
                0.18em;

            text-transform:
                uppercase;

            opacity: 0.35;

            margin-bottom: 18px;
        }

        .qualia-name {

            font-size:
                clamp(24px, 3vw, 42px);

            font-weight: 300;

            letter-spacing:
                -0.025em;
        }

        .qualia-arrow {

            position: absolute;

            bottom: 20px;
            right: 22px;

            opacity: 0.35;

            transition:
                opacity 0.4s ease,

                transform 0.4s ease;
        }

        .qualia-box:hover .qualia-arrow {

            opacity: 1;

            transform:
                translate(3px,-3px);
        }


        /* =====================================================
           FOOTER
        ===================================================== */

        footer {

            width: 100%;

            padding:
                30px
                20px
                35px;

            border-top:
                1px solid
                rgba(255,255,255,0.08);

            display: flex;

            justify-content:
                space-between;

            align-items: center;

            font-size: 9px;

            letter-spacing:
                0.12em;

            text-transform:
                uppercase;

            opacity: 0.4;
        }

        footer a {

            color: #fff;

            text-decoration: none;
        }

        footer a:hover {
            opacity: 0.6;
        }


        /* =====================================================
           RESPONSIVE
        ===================================================== */

        @media (max-width: 800px) {

            .top-header {

                padding:
                    15px;
            }

            .counter {
                display: none;
            }

            .hero {

                padding:
                    50px
                    15px
                    80px;
            }

            .main-logo {

                width: 320px;
            }

            .email {

                font-size: 15px;

                margin-top: 24px;
            }

            .section {

                padding:
                    80px
                    15px;
            }

            .section-header {

                margin-bottom: 20px;
            }

            .clip-card {

                flex:
                    0 0 88vw;
            }

            .credit-card,
            .spotify-card,
            .soundcloud-card {

                flex:
                    0 0 88vw;

                height: 270px;
            }

            .arrow {

                opacity: 0.8;

                width: 38px;
                height: 38px;
            }

            .arrow.left {
                left: 8px;
            }

            .arrow.right {
                right: 8px;
            }

            .social-section {

                padding:
                    60px
                    15px
                    35px;
            }

            .untitled-section {

                gap: 35px;

                flex-wrap: wrap;
            }

            .short-film-section {

                padding-bottom: 80px;
            }

            .qualia-section {

                padding:
                    70px
                    15px
                    120px;
            }

            .qualia-grid {

                grid-template-columns:
                    1fr;
            }

            .qualia-box {

                min-height: 330px;
            }

            footer {

                flex-direction: column;

                gap: 15px;

                text-align: center;
            }

        }


        /* =====================================================
           RÉDUCTION DES ANIMATIONS
        ===================================================== */

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {

                animation-duration: 0.01ms !important;

                animation-iteration-count:
                    1 !important;

                transition-duration:
                    0.01ms !important;

                scroll-behavior:
                    auto !important;
            }

        }

    </style>

</head>


<body>

         HALO SOURIS
    ===================================================== -->

        id="cursorGlow">
    </div>


    <!-- =====================================================

        <div class="counter">
            PORTFOLIO
        </div>

    </header>


    <!-- =====================================================
         CONTENU
    ===================================================== -->

    <main>


        <!-- =================================================
             HERO
        ================================================= -->

            <div class="hero-inner">

                <img
                    src="assets/logo kalifa.png"

                        </iframe>

                    </div>


                    <!-- CLIP 03 -->

                    <div class="clip-card">

                        <iframe

                            allowfullscreen>
                        </iframe>

                    </div>


                    <!-- CLIP 04 -->

                    <div class="clip-card">

                        <iframe
                            src="https://www.youtube.com/embed/HV0eSCzyPRI"
                            title="Clip YouTube 04"
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                            allowfullscreen>
                        </iframe>

                    </div>


                    <!-- CLIP 05 -->

                    <div class="clip-card">

                        <iframe
                            src="https://www.youtube.com/embed/S0FWBMS7t6k"
                            title="Clip YouTube 05"
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                            allowfullscreen>

                    </div>


                    <!-- CLIP 06 -->

                    <div class="clip-card">

                        <iframe
                            src="https://www.youtube.com/embed/jvVhQVrdKzY"
                            title="Clip YouTube 06"
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                            allowfullscreen>
                        </iframe>

                    </div>


                    <!-- CLIP 07 -->

                    <div class="clip-card">

    <script>


        /* =====================================================
           SON DU LOGO
        ===================================================== */

        const logo =
            document.getElementById("mainLogo");

        const logoSound =
            document.getElementById("logoSound");


        logo.addEventListener(
            "mouseenter",
            () => {

                logoSound.currentTime = 0;

                logoSound.play().catch(() => {});

            }
        );


        /* =====================================================
           HALO SOURIS
        ===================================================== */

        const cursorGlow =
            document.getElementById("cursorGlow");


        document.addEventListener(
            "mousemove",
            (event) => {

                cursorGlow.style.left =
                    event.clientX + "px";

                cursorGlow.style.top =
                    event.clientY + "px";

            }
        );


        /* =====================================================
           SCROLL HORIZONTAL
        ===================================================== */

        function scrollRightCustom(id) {

            const container =
                document.getElementById(id);

            const amount =
                Math.min(
                    container.clientWidth * 0.72,
                    720
                );


            if (
                container.scrollLeft +
                container.clientWidth
                >=
                container.scrollWidth - 10
            ) {

                container.scrollTo({

                    left: 0,

                    behavior: "smooth"

                });

            } else {

                container.scrollBy({

                    left: amount,

                    behavior: "smooth"

                });

            }

        }


        function scrollLeftCustom(id) {

            const container =
                document.getElementById(id);

            const amount =
                Math.min(
                    container.clientWidth * 0.72,
                    720
                );


            if (
                container.scrollLeft <= 10
            ) {

                container.scrollTo({

                    left:
                        container.scrollWidth,

                    behavior:
                        "smooth"

                });

            } else {

                container.scrollBy({

                    left:
                        -amount,

                    behavior:
                        "smooth"

                });

            }

        }


        /* =====================================================
           APPARITION CINÉMATIQUE DES SECTIONS
        ===================================================== */

        const sections =
            document.querySelectorAll(
                ".section"
            );


        const revealObserver =
            new IntersectionObserver(

                (entries) => {

                    entries.forEach(
                        (entry) => {

                            if (
                                entry.isIntersecting
                            ) {

                                entry.target.classList.add(
                                    "visible"
                                );

                            }

                        }
                    );

                },

                {
                    threshold: 0.12,

                    rootMargin:
                        "0px 0px -8% 0px"
                }

            );


        sections.forEach(
            (section) => {

                revealObserver.observe(
                    section
                );

            }
        );


    </script>
