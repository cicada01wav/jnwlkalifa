<!DOCTYPE html>
<html lang="fr">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>JNWLKALIFA</title>

  <link rel="icon" type="image/png" href="assets/logo kalifa.png">
  <link rel="apple-touch-icon" href="assets/logo kalifa.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Rajdhani:wght@400;500&display=swap" rel="stylesheet">

  <style>

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
      position: relative;
      cursor: default;
    }

    /* =========================================================
       HALO SOURIS
    ========================================================= */

    #cursorGlow {

      position: fixed;

      width: 500px;
      height: 500px;

      border-radius: 50%;

      pointer-events: none;

      z-index: 0;

      background:
        radial-gradient(
          circle,
          rgba(255,255,255,0.055) 0%,
          rgba(255,255,255,0.02) 20%,
          rgba(255,255,255,0) 70%
        );

      transform: translate(-50%, -50%);

      transition:
        transform 0.08s linear;

      mix-blend-mode: screen;
    }

    /* =========================================================
       GRAIN
    ========================================================= */

    body::before {

      content: "";

      position: fixed;
      inset: 0;

      width: 100%;
      height: 100%;

      pointer-events: none;

      z-index: 1;

      opacity: 0.055;

      background-image:
        url("https://www.transparenttextures.com/patterns/asfalt-light.png");

      animation: noiseMove 0.25s infinite;
    }

    @keyframes noiseMove {

      0% {
        transform: translate(0, 0);
      }

      25% {
        transform: translate(-1%, 1%);
      }

      50% {
        transform: translate(1%, -1%);
      }

      75% {
        transform: translate(-1%, -1%);
      }

      100% {
        transform: translate(0, 0);
      }

    }

    /* =========================================================
       LIGNES CRT
    ========================================================= */

    body::after {

      content: "";

      position: fixed;
      inset: 0;

      width: 100%;
      height: 100%;

      pointer-events: none;

      z-index: 2;

      opacity: 0.06;

      background:
        repeating-linear-gradient(
          to bottom,
          rgba(255,255,255,0.025) 0px,
          rgba(255,255,255,0.025) 1px,
          transparent 2px,
          transparent 4px
        );

      mix-blend-mode: soft-light;
    }

    /* =========================================================
       VIGNETTE
    ========================================================= */

    .vignette {

      position: fixed;
      inset: 0;

      pointer-events: none;

      z-index: 4;

      box-shadow:
        inset 0 0 180px rgba(0,0,0,0.85),
        inset 0 0 70px rgba(0,0,0,0.45);
    }

    /* =========================================================
       LIENS
    ========================================================= */

    a,
    a:link,
    a:visited,
    a:hover,
    a:active {

      color: #fff !important;

      -webkit-text-fill-color: #fff;

      text-decoration: none;
    }

    /* =========================================================
       INTRO
    ========================================================= */

    #intro {

      position: fixed;

      inset: 0;

      z-index: 999999;

      background: #000;

      display: flex;

      justify-content: center;

      align-items: center;

      animation: introFade 1.35s ease forwards;
    }

    .intro-logo {

      width: 280px;

      max-width: 60vw;

      opacity: 0;

      transform: scale(0.92);

      animation:
        introLogoIn 0.8s ease forwards;
    }

    @keyframes introLogoIn {

      0% {

        opacity: 0;

        transform:
          scale(0.92);
      }

      100% {

        opacity: 1;

        transform:
          scale(1);
      }
    }

    @keyframes introFade {

      0% {
        opacity: 1;
        visibility: visible;
      }

      72% {
        opacity: 1;
      }

      100% {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
    }

    /* =========================================================
       SITE
    ========================================================= */

    #siteWrapper {

      position: relative;

      z-index: 5;

      transition:
        filter 0.45s ease,
        transform 0.45s ease;
    }

    #siteWrapper.blur-active {

      filter:
        blur(6px)
        brightness(0.52);
    }

    /* =========================================================
       HEADER
    ========================================================= */

    header {

      position: fixed;

      top: 0;
      left: 0;
      right: 0;

      z-index: 1000;

      display: flex;

      justify-content: space-between;

      align-items: center;

      padding: 24px 32px;

      font-family: 'Rajdhani', sans-serif;

      font-size: 0.76rem;

      letter-spacing: 3px;

      text-transform: uppercase;

      pointer-events: none;

      opacity: 0.82;
    }

    .header-left,
    .header-right {

      pointer-events: auto;
    }

    /* =========================================================
       HERO
    ========================================================= */

    .hero {

      height: 100vh;

      min-height: 700px;

      display: flex;

      flex-direction: column;

      justify-content: center;

      align-items: center;

      text-align: center;

      padding-top: 60px;
    }

    .logo {

      width: 320px;

      max-width: 65vw;

      display: block;

      cursor: pointer;

      transform:
        scale(1);

      transition:
        transform 0.6s cubic-bezier(.16,1,.3,1),
        filter 0.6s ease;
    }

    .logo:hover {

      transform:
        scale(1.06);

      filter:
        brightness(1.08)
        drop-shadow(0 0 30px rgba(255,255,255,0.08));
    }

    .email {

      margin-top: 34px;

      font-family: 'Rajdhani', sans-serif;

      font-size: 0.9rem;

      letter-spacing: 3px;

      opacity: 0.62;

      transition:
        opacity 0.3s ease;
    }

    .email:hover {
      opacity: 1;
    }

    /* =========================================================
       SECTIONS
    ========================================================= */

    section {

      position: relative;

      width: 100%;

      padding: 70px 0 90px;

      opacity: 0;

      transform:
        translateY(35px);

      transition:
        opacity 1s ease,
        transform 1s ease;
    }

    section.visible {

      opacity: 1;

      transform:
        translateY(0);
    }

    .section-title {

      padding-left: 50px;

      margin-bottom: 22px;

      font-family: 'Rajdhani', sans-serif;

      font-size: 1.4rem;

      font-weight: 400;

      letter-spacing: 4px;

      text-transform: uppercase;

      opacity: 0.82;
    }

    /* =========================================================
       HORIZONTAL SCROLL
    ========================================================= */

    .scroll-wrapper {

      position: relative;

      width: 100%;
    }

    .horizontal-scroll {

      display: flex;

      gap: 22px;

      overflow-x: auto;

      overflow-y: hidden;

      padding: 15px 50px 25px;

      scrollbar-width: none;

      -ms-overflow-style: none;

      -webkit-overflow-scrolling: touch;
    }

    .horizontal-scroll::-webkit-scrollbar {
      display: none;
    }

    /* =========================================================
       ARROWS
    ========================================================= */

    .arrow {

      position: absolute;

      top: 50%;

      transform:
        translateY(-50%);

      width: 52px;
      height: 52px;

      border-radius: 50%;

      border: none;

      background:
        rgba(255,255,255,0.07);

      color: #fff;

      font-size: 2rem;

      cursor: pointer;

      z-index: 20;

      transition:
        transform 0.3s ease,
        background 0.3s ease,
        opacity 0.3s ease;

      backdrop-filter: blur(8px);

      opacity: 0.42;
    }

    .scroll-wrapper:hover .arrow {
      opacity: 0.78;
    }

    .arrow:hover {

      background:
        rgba(255,255,255,0.16);

      transform:
        translateY(-50%)
        scale(1.08);

      opacity: 1;
    }

    .arrow.left {
      left: 8px;
    }

    .arrow.right {
      right: 8px;
    }

    /* =========================================================
       VIDEO CARDS
    ========================================================= */

    .video-card {

      min-width: 620px;

      width: 620px;

      height: 350px;

      flex-shrink: 0;

      background: #080808;

      border: 1px solid rgba(255,255,255,0.12);

      border-radius: 20px;

      overflow: hidden;

      transition:
        transform 0.45s ease,
        filter 0.45s ease,
        box-shadow 0.45s ease;
    }

    .video-card:hover {

      transform:
        scale(1.015);

      filter:
        brightness(1.05);

      box-shadow:
        0 0 40px rgba(255,255,255,0.05);
    }

    .video-card iframe {

      width: 100%;

      height: 100%;

      border: none;

      display: block;
    }

    /* =========================================================
       LIENS ENTRE LES SECTIONS
    ========================================================= */

    .between-links {

      width: 100%;

      display: flex;

      justify-content: center;

      align-items: center;

      flex-wrap: wrap;

      gap: 34px;

      padding:
        15px 20px 70px;

      text-align: center;
    }

    .between-links a {

      font-family: 'Rajdhani', sans-serif;

      font-size: 0.88rem;

      letter-spacing: 3px;

      text-transform: uppercase;

      opacity: 0.62;

      transition:
        opacity 0.3s ease,
        transform 0.3s ease;
    }

    .between-links a:hover {

      opacity: 1;

      transform:
        translateY(-2px);
    }

    .untitled-links {

      display: flex;

      justify-content: center;

      align-items: center;

      gap: 34px;
    }

    /* =========================================================
       CREDITS CARD
    ========================================================= */

    .credit-card {

      min-width: 500px;

      width: 500px;

      height: 360px;

      flex-shrink: 0;

      background: #0a0a0a;

      border: 1px solid rgba(255,255,255,0.11);

      border-radius: 22px;

      overflow: hidden;

      position: relative;

      transition:
        transform 0.45s ease,
        filter 0.45s ease,
        box-shadow 0.45s ease;
    }

    .credit-card:hover {

      transform:
        scale(1.015);

      filter:
        brightness(1.04);

      box-shadow:
        0 0 40px rgba(255,255,255,0.05);
    }

    /* =========================================================
       MUSO
    ========================================================= */

    .muso-card {

      min-width: 500px;

      width: 500px;

      min-height: 360px;

      flex-shrink: 0;

      display: flex;

      align-items: center;

      justify-content: center;

      background: #0a0a0a;

      border: 1px solid rgba(255,255,255,0.11);

      border-radius: 22px;

      overflow: hidden;

      padding: 22px;

      transition:
        transform 0.45s ease,
        filter 0.45s ease,
        box-shadow 0.45s ease;
    }

    .muso-card:hover {

      transform:
        scale(1.015);

      filter:
        brightness(1.04);

      box-shadow:
        0 0 40px rgba(255,255,255,0.05);
    }

    .muso-card script {
      display: block;
    }

    /* =========================================================
       SPOTIFY
    ========================================================= */

    .spotify-card {

      min-width: 520px;

      width: 520px;

      height: 360px;

      flex-shrink: 0;

      overflow: hidden;

      border-radius: 22px;

      background: #0d0d0d;

      border: 1px solid rgba(255,255,255,0.11);

      box-shadow:
        0 0 35px rgba(255,255,255,0.04);

      transition:
        transform 0.45s ease,
        filter 0.45s ease,
        box-shadow 0.45s ease;
    }

    .spotify-card:hover {

      transform:
        scale(1.015);

      filter:
        brightness(1.04);

      box-shadow:
        0 0 40px rgba(255,255,255,0.05);
    }

    .spotify-card iframe {

      width: 100%;

      height: 100%;

      border: none;

      display: block;

      border-radius: 22px;
    }

    /* =========================================================
       SOUNDCLOUD
    ========================================================= */

    .soundcloud-card {

      min-width: 520px;

      width: 520px;

      height: 300px;

      flex-shrink: 0;

      background: #080808;

      border: 1px solid rgba(255,255,255,0.11);

      border-radius: 22px;

      overflow: hidden;

      transition:
        transform 0.45s ease,
        filter 0.45s ease,
        box-shadow 0.45s ease;
    }

    .soundcloud-card:hover {

      transform:
        scale(1.015);

      filter:
        brightness(1.04);

      box-shadow:
        0 0 40px rgba(255,255,255,0.05);
    }

    .soundcloud-card iframe {

      width: 100%;

      height: 100%;

      display: block;

      border: none;
    }

    /* =========================================================
       QUALIA CARDS
    ========================================================= */

    .qualia-card {

      min-width: 360px;

      width: 360px;

      height: 430px;

      flex-shrink: 0;

      display: flex;

      flex-direction: column;

      background: #0a0a0a;

      border: 1px solid rgba(255,255,255,0.11);

      border-radius: 22px;

      overflow: hidden;

      transition:
        transform 0.5s ease,
        filter 0.5s ease,
        box-shadow 0.5s ease;
    }

    .qualia-card:hover {

      transform:
        scale(1.025);

      filter:
        brightness(1.05);

      box-shadow:
        0 0 40px rgba(255,255,255,0.06);
    }

    .qualia-top {

      display: flex;

      justify-content: space-between;

      align-items: center;

      padding: 18px 20px;

      border-bottom: 1px solid rgba(255,255,255,0.08);

      font-family: 'Rajdhani', sans-serif;

      font-size: 0.75rem;

      letter-spacing: 2px;

      text-transform: uppercase;

      opacity: 0.72;
    }

    .qualia-image-wrap {

      flex: 1;

      display: flex;

      justify-content: center;

      align-items: center;

      padding: 30px;

      background: #050505;
    }

    .qualia-image {

      width: 210px;

      height: 210px;

      object-fit: contain;

      border-radius: 50%;

      display: block;

      transition:
        transform 0.5s ease;
    }

    .qualia-card:hover .qualia-image {

      transform:
        scale(1.04);
    }

    .qualia-bottom {

      padding: 18px 20px 20px;

      border-top: 1px solid rgba(255,255,255,0.08);

      display: flex;

      flex-direction: column;

      gap: 8px;
    }

    .qualia-name {

      font-family: 'Rajdhani', sans-serif;

      font-size: 1rem;

      letter-spacing: 2px;

      opacity: 0.9;
    }

    .qualia-action {

      font-family: 'Rajdhani', sans-serif;

      font-size: 0.72rem;

      letter-spacing: 2px;

      text-transform: uppercase;

      opacity: 0.48;

      transition:
        opacity 0.3s ease;
    }

    .qualia-card:hover .qualia-action {
      opacity: 0.95;
    }

    /* =========================================================
       FOOTER
    ========================================================= */

    footer {

      text-align: center;

      padding:
        80px 20px 45px;

      font-family: 'Rajdhani', sans-serif;

      letter-spacing: 2px;

      opacity: 0.58;
    }

    .footer-name {

      font-size: 1.25rem;

      margin-bottom: 14px;
    }

    .footer-email {

      font-size: 0.8rem;

      margin-bottom: 18px;
    }

    .footer-year {

      font-size: 0.7rem;

      opacity: 0.55;
    }

    /* =========================================================
       TIMER
    ========================================================= */

    #timer {

      position: fixed;

      bottom: 18px;
      right: 22px;

      z-index: 999999;

      font-family: 'Rajdhani', sans-serif;

      font-size: 0.72rem;

      letter-spacing: 1px;

      color: rgba(255,255,255,0.42);

      background:
        rgba(0,0,0,0.35);

      padding:
        8px 10px;

      border:
        1px solid rgba(255,255,255,0.08);

      border-radius: 8px;

      backdrop-filter:
        blur(8px);

      pointer-events: none;
    }

    /* =========================================================
       RESPONSIVE
    ========================================================= */

    @media (max-width: 768px) {

      body {
        cursor: auto;
      }

      #cursorGlow {
        display: none;
      }

      body::before {
        opacity: 0.03;
      }

      body::after {
        opacity: 0.04;
      }

      header {

        padding:
          18px 20px;

        font-size: 0.68rem;

        letter-spacing: 2px;
      }

      .hero {

        height: 78vh;

        min-height: 560px;

        padding-top: 20px;
      }

      .intro-logo {
        width: 210px;
      }

      .logo {

        width: 210px;

        max-width: 70vw;
      }

      .email {

        margin-top: 25px;

        font-size: 0.78rem;

        letter-spacing: 2px;
      }

      section {

        padding:
          45px 0 65px;
      }

      .section-title {

        font-size: 1.15rem;

        padding-left: 20px;

        margin-bottom: 10px;

        letter-spacing: 3px;
      }

      .horizontal-scroll {

        padding:
          10px 20px 20px;

        gap: 14px;
      }

      .arrow {

        width: 40px;
        height: 40px;

        font-size: 1.4rem;

        opacity: 0.55;
      }

      .arrow.left {
        left: 4px;
      }

      .arrow.right {
        right: 4px;
      }

      .video-card {

        min-width: 88vw;

        width: 88vw;

        height: 230px;

        border-radius: 16px;
      }

      /* =====================================================
         LIENS CENTRES MOBILE
      ====================================================== */

      .between-links {

        flex-direction: column;

        gap: 22px;

        padding:
          10px 20px 60px;
      }

      .untitled-links {

        gap: 20px;

        flex-wrap: wrap;

        justify-content: center;
      }

      .between-links a {

        font-size: 0.8rem;

        letter-spacing: 2px;
      }

      .muso-card {

        min-width: 88vw;

        width: 88vw;

        min-height: 300px;

        border-radius: 16px;

        padding: 15px;
      }

      .spotify-card {

        min-width: 88vw;

        width: 88vw;

        height: 300px;

        border-radius: 16px;
      }

      .spotify-card iframe {
        border-radius: 16px;
      }

      .soundcloud-card {

        min-width: 88vw;

        width: 88vw;

        height: 280px;

        border-radius: 16px;
      }

      .qualia-card {

        min-width: 82vw;

        width: 82vw;

        height: 390px;

        border-radius: 16px;
      }

      .qualia-image {

        width: 170px;
        height: 170px;
      }

      footer {

        padding:
          55px 20px 90px;
      }

      #timer {

        bottom: 12px;
        right: 12px;

        font-size: 0.68rem;

        padding:
          7px 9px;
      }

    }

  </style>

</head>

  <!-- =========================================================
       JAVASCRIPT
  ========================================================= -->

  <script>

    /* =========================================================
       LOGO + SON
    ========================================================= */

    const logo =
      document.getElementById("mainLogo");

    const siteWrapper =
      document.getElementById("siteWrapper");

    const hoverSound =
      new Audio("assets/c'est pour toi.wav");

    hoverSound.volume = 0.85;

    if (logo) {

      logo.addEventListener("mouseenter", () => {

        if (window.innerWidth > 768) {

          siteWrapper.classList.add("blur-active");

        }

        hoverSound.currentTime = 0;

        hoverSound.play().catch(() => {});

        if (navigator.vibrate) {

          navigator.vibrate(35);

        }

      });

      logo.addEventListener("mouseleave", () => {

        siteWrapper.classList.remove("blur-active");

      });

    }

    /* =========================================================
       HALO
    ========================================================= */

    const glow =
      document.getElementById("cursorGlow");

    document.addEventListener("mousemove", (e) => {

      if (glow) {

        glow.style.left =
          e.clientX + "px";

        glow.style.top =
          e.clientY + "px";

      }

    });

    /* =========================================================
       SECTION REVEAL
    ========================================================= */

    const sections =
      document.querySelectorAll("section");

    const sectionObserver =
      new IntersectionObserver(
        (entries) => {

          entries.forEach((entry) => {

            if (entry.isIntersecting) {

              entry.target.classList.add("visible");

            }

          });

        },
        {
          threshold: 0.08
        }
      );

    sections.forEach((section) => {

      sectionObserver.observe(section);

    });

    /* =========================================================
       SCROLL HORIZONTAL
    ========================================================= */

    function scrollHorizontal(button, direction) {

      const wrapper =
        button.closest(".scroll-wrapper");

      if (!wrapper) {
        return;
      }

      const scrollArea =
        wrapper.querySelector(".horizontal-scroll");

      if (!scrollArea) {
        return;
      }

      const amount =
        Math.max(
          scrollArea.clientWidth * 0.78,
          380
        );

      scrollArea.scrollBy({

        left:
          direction * amount,

        behavior:
          "smooth"

      });

    }

    /* =========================================================
       TIMER
    ========================================================= */

    const timer =
      document.getElementById("timer");

    const timerStart =
      performance.now();

    function updateTimer() {

      const elapsed =
        performance.now() - timerStart;

      const totalMilliseconds =
        Math.floor(elapsed);

      const milliseconds =
        totalMilliseconds % 1000;

      const totalSeconds =
        Math.floor(totalMilliseconds / 1000);

      const seconds =
        totalSeconds % 60;

      const totalMinutes =
        Math.floor(totalSeconds / 60);

      const minutes =
        totalMinutes % 60;

      const hours =
        Math.floor(totalMinutes / 60);

      const hh =
        String(hours).padStart(2, "0");

      const mm =
        String(minutes).padStart(2, "0");

      const ss =
        String(seconds).padStart(2, "0");

      const ms =
        String(milliseconds).padStart(3, "0");

      if (timer) {

        timer.textContent =
          `${hh}:${mm}:${ss}:${ms}`;

      }

      requestAnimationFrame(updateTimer);

    }

    updateTimer();

  </script>
